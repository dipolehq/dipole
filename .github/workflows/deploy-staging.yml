name: Deploy Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  CLOUD_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dipole/cloud
  PROXY_IMAGE: ghcr.io/${{ github.repository_owner }}/proxy
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/controller
  INJECTOR_IMAGE: ghcr.io/${{ github.repository_owner }}/injector
  INIT_IMAGE: ghcr.io/${{ github.repository_owner }}/init

jobs:
  ci:
    name: CI Check
    uses: ./.github/workflows/ci.yml

  deploy-cloud:
    name: Deploy Cloud to Staging
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Cloud image
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --cache-from ${{ env.CLOUD_IMAGE }}:staging \
            -f cloud/Dockerfile \
            -t ${{ env.CLOUD_IMAGE }}:${{ github.sha }} \
            -t ${{ env.CLOUD_IMAGE }}:staging .
          docker push ${{ env.CLOUD_IMAGE }}:${{ github.sha }}
          docker push ${{ env.CLOUD_IMAGE }}:staging

      - name: Deploy to Cloud Run (staging)
        run: |
          gcloud run deploy dipole-cloud-staging \
            --project dipole-staging \
            --image ${{ env.CLOUD_IMAGE }}:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --set-env-vars "DIPOLE_HTTP_PORT=8080,DIPOLE_GRPC_PORT=50051,DIPOLE_REGION=${{ vars.DIPOLE_REGION }},DIPOLE_CORS_ALLOWED_ORIGINS=https://staging-console.dipolehq.com,DIPOLE_VERSION=${{ github.sha }}" \
            --set-secrets "DIPOLE_DATABASE_URL=dipole-db-url:latest,DIPOLE_ENCRYPTION_KEY=dipole-enc-key:latest,DIPOLE_RESEND_API_KEY=dipole-resend-key:latest"

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe dipole-cloud-staging --project dipole-staging --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/v1/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Staging deployment healthy at $URL"

  push-edge-images:
    name: Push Edge Images
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Edge images
        run: |
          docker build --platform linux/amd64 -f edge/Dockerfile.proxy -t ${{ env.PROXY_IMAGE }}:${{ github.sha }} -t ${{ env.PROXY_IMAGE }}:staging .
          docker build --platform linux/amd64 -f edge/Dockerfile.controller -t ${{ env.CONTROLLER_IMAGE }}:${{ github.sha }} -t ${{ env.CONTROLLER_IMAGE }}:staging .
          docker build --platform linux/amd64 -f edge/Dockerfile.injector -t ${{ env.INJECTOR_IMAGE }}:${{ github.sha }} -t ${{ env.INJECTOR_IMAGE }}:staging .
          docker build --platform linux/amd64 -f edge/Dockerfile.init -t ${{ env.INIT_IMAGE }}:${{ github.sha }} -t ${{ env.INIT_IMAGE }}:staging .
          docker push ${{ env.PROXY_IMAGE }}:${{ github.sha }}
          docker push ${{ env.PROXY_IMAGE }}:staging
          docker push ${{ env.CONTROLLER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.CONTROLLER_IMAGE }}:staging
          docker push ${{ env.INJECTOR_IMAGE }}:${{ github.sha }}
          docker push ${{ env.INJECTOR_IMAGE }}:staging
          docker push ${{ env.INIT_IMAGE }}:${{ github.sha }}
          docker push ${{ env.INIT_IMAGE }}:staging

  deploy-frontend-staging:
    name: Deploy Frontend to Staging
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: https://staging-api.dipolehq.com

      - name: Deploy to Cloudflare Pages (staging)
        working-directory: web
        run: npx wrangler pages deploy dist --project-name=dipole-console-staging --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
