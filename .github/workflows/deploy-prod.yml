name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (commit SHA from staging)"
        required: true
        type: string
      confirm:
        description: "Type 'deploy' to confirm production deployment"
        required: true
        type: string

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  CLOUD_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dipole/cloud
  PROXY_IMAGE: ghcr.io/${{ github.repository_owner }}/proxy
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/controller
  INJECTOR_IMAGE: ghcr.io/${{ github.repository_owner }}/injector
  INIT_IMAGE: ghcr.io/${{ github.repository_owner }}/init

jobs:
  validate:
    name: Validate Input
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'deploy'
        run: |
          echo "Deployment not confirmed. Type 'deploy' to proceed."
          exit 1

      - name: Log deployment
        run: echo "Deploying image tag ${{ inputs.image_tag }} to production"

  deploy-cloud:
    name: Deploy Cloud to Production
    runs-on: ubuntu-latest
    needs: [validate]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Tag image for production
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker pull ${{ env.CLOUD_IMAGE }}:${{ inputs.image_tag }}
          docker tag ${{ env.CLOUD_IMAGE }}:${{ inputs.image_tag }} ${{ env.CLOUD_IMAGE }}:production
          docker tag ${{ env.CLOUD_IMAGE }}:${{ inputs.image_tag }} ${{ env.CLOUD_IMAGE }}:latest
          docker push ${{ env.CLOUD_IMAGE }}:production
          docker push ${{ env.CLOUD_IMAGE }}:latest

      - name: Deploy to Cloud Run (production)
        run: |
          gcloud run deploy dipole-cloud \
            --image ${{ env.CLOUD_IMAGE }}:${{ inputs.image_tag }} \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 4 \
            --set-env-vars "DIPOLE_HTTP_PORT=8080,DIPOLE_GRPC_PORT=50051,DIPOLE_REGION=${{ vars.DIPOLE_REGION }},DIPOLE_CORS_ALLOWED_ORIGINS=https://console.dipolehq.com,DIPOLE_VERSION=${{ inputs.image_tag }}" \
            --set-secrets "DIPOLE_DATABASE_URL=dipole-db-url:latest,DIPOLE_ENCRYPTION_KEY=dipole-enc-key:latest,DIPOLE_RESEND_API_KEY=dipole-resend-key:latest"

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe dipole-cloud --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/v1/health")
          if [ "$STATUS" != "200" ]; then
            echo "Production health check failed with status $STATUS"
            exit 1
          fi
          echo "Production deployment healthy at $URL"

  tag-edge-images:
    name: Tag Edge Images for Production
    runs-on: ubuntu-latest
    needs: [validate]
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag Edge images as production
        run: |
          for IMAGE in ${{ env.PROXY_IMAGE }} ${{ env.CONTROLLER_IMAGE }} ${{ env.INJECTOR_IMAGE }} ${{ env.INIT_IMAGE }}; do
            docker pull "$IMAGE:${{ inputs.image_tag }}"
            docker tag "$IMAGE:${{ inputs.image_tag }}" "$IMAGE:production"
            docker tag "$IMAGE:${{ inputs.image_tag }}" "$IMAGE:latest"
            docker push "$IMAGE:production"
            docker push "$IMAGE:latest"
          done

  deploy-frontend-prod:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    needs: [validate]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: https://api.dipolehq.com

      - name: Deploy to Cloudflare Pages (production)
        working-directory: web
        run: npx wrangler pages deploy dist --project-name=dipole-console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
