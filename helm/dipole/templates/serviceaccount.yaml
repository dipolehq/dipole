{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ include "dipole.namespace" . }}
  labels:
    {{- include "dipole.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.openshift.scc }}
  annotations:
    openshift.io/scc: {{ .Values.serviceAccount.openshift.scc }}
  {{- end }}
{{- end }}
