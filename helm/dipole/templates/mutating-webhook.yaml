apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "dipole.injectorName" . }}
  labels:
    {{- include "dipole.labels" . | nindent 4 }}
webhooks:
  - name: agent-inject.dipolehq.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    clientConfig:
      service:
        name: {{ include "dipole.injectorName" . }}
        namespace: {{ include "dipole.namespace" . }}
        path: /mutate
        port: 443
      caBundle: ""  # Populated by injector on startup or cert-manager
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
    {{- if .Values.agentInjector.filters.namespaces }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- range .Values.agentInjector.filters.namespaces }}
            - {{ . | quote }}
            {{- end }}
    {{- end }}
