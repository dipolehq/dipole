apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dipole.injectorName" . }}
  namespace: {{ include "dipole.namespace" . }}
  labels:
    {{- include "dipole.labels" . | nindent 4 }}
    app: {{ include "dipole.injectorName" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dipole.injectorName" . }}
  template:
    metadata:
      labels:
        app: {{ include "dipole.injectorName" . }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: injector
          image: "{{ .Values.agentInjector.image.repository }}:{{ .Values.agentInjector.image.tag }}"
          imagePullPolicy: {{ .Values.agentInjector.image.pullPolicy }}
          ports:
            - containerPort: 443
              name: webhook
          env:
            - name: DIPOLE_TENANT_ID
              value: {{ .Values.tenant | quote }}
            - name: DIPOLE_PROXY_IMAGE
              value: "{{ .Values.agentProxy.image.repository }}:{{ .Values.agentProxy.image.tag }}"
            - name: DIPOLE_INIT_IMAGE
              value: "{{ .Values.init.image.repository }}:{{ .Values.init.image.tag }}"
            - name: DIPOLE_WEBHOOK_NAME
              value: {{ include "dipole.injectorName" . }}
            - name: DIPOLE_CONTROLLER_URL
              value: "http://{{ include "dipole.controllerName" . }}.{{ include "dipole.namespace" . }}.svc.cluster.local:80"
            {{- if .Values.cloud.grpcEndpoint }}
            - name: DIPOLE_CLOUD_GRPC_ENDPOINT
              value: {{ .Values.cloud.grpcEndpoint | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.agentInjector.resources | nindent 12 }}
      {{- with .Values.agentInjector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentInjector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentInjector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
