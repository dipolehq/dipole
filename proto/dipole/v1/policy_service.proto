syntax = "proto3";
package dipole.v1;
option go_package = "github.com/dipolehq/dipole/gen/dipole/v1;dipolev1";

service PolicyEvaluationService {
  rpc Evaluate(PolicyEvaluationRequest) returns (PolicyEvaluationResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc RefreshSessionToken(RefreshSessionTokenRequest) returns (RefreshSessionTokenResponse);
  rpc ReportHealth(HealthReport) returns (HealthAck);
  rpc IngestEvents(stream WorkloadEventBatch) returns (EventAck);
  rpc SignLeafCertificate(SignLeafRequest) returns (SignLeafResponse);
}

// --- Policy Evaluation ---

message PolicyEvaluationRequest {
  string proxy_id = 1;
  string tenant_id = 2;
  string resource_set_id = 3;
  ClientEvidence client = 4;
  ServerTarget server = 5;
}

message PolicyEvaluationResponse {
  bool allowed = 1;
  string deny_reason = 2;
  Credential credential = 3;
  InjectionConfig injection = 4;
  string policy_id = 5;
  string client_workload_id = 6;
  string server_workload_id = 7;
  repeated TrustProviderResult trust_results = 8;
}

// --- Client Evidence ---

message ClientEvidence {
  string source_ip = 1;
  string hostname = 2;
  K8sEvidence k8s = 3;
  AwsEvidence aws = 4;
  AzureEvidence azure = 5;
  GcpEvidence gcp = 6;
  IdentityTokenEvidence github = 7;
  IdentityTokenEvidence gitlab = 8;
  IdentityTokenEvidence terraform = 9;
  ProcessEvidence process = 10;
  map<string, string> environment = 11;
  string dipole_client_id = 12;
  string redirect_uri = 13;
}

message K8sEvidence {
  string service_account_token = 1;
  string namespace = 2;
  string pod_name = 3;
  string service_account_name = 4;
  string service_account_uid = 5;
}

message AwsEvidence {
  string instance_identity_document = 1;
  string instance_identity_signature = 2;
  StsGetCallerIdentity sts_get_caller_identity = 3;
}

message StsGetCallerIdentity {
  map<string, string> signed_headers = 1;
  string region = 2;
}

message AzureEvidence {
  string encoding = 1;
  string signature = 2;
  string nonce = 3;
}

message GcpEvidence {
  string identity_token = 1;
}

message IdentityTokenEvidence {
  string identity_token = 1;
}

message ProcessEvidence {
  string name = 1;
  string path = 2;
  string command_line = 3;
  string user_name = 4;
}

// --- Server Target ---

message ServerTarget {
  string host = 1;
  int32 port = 2;
}

// --- Credential & Injection ---

message Credential {
  string type = 1;
  string value = 2;
  string username = 3;
  string password = 4;
  string aws_access_key_id = 5;
  string aws_secret_access_key = 6;
  string aws_session_token = 7;
  int64 expires_at = 8;
}

message InjectionConfig {
  string method = 1;
  string header_name = 2;
  string prefix = 3;
  string query_param = 4;
  string scheme = 5;
}

message TrustProviderResult {
  string provider_id = 1;
  string provider_name = 2;
  bool attested = 3;
  string reason = 4;
  string attribute = 5;
  string expected_value = 6;
  string actual_value = 7;
}

// --- Registration ---

message RegisterRequest {
  string tenant_id = 1;
  string registration_token = 2;
  string proxy_version = 3;
}

message RegisterResponse {
  string proxy_id = 1;
  bool success = 2;
  string error_message = 3;
  string ca_cert_pem = 4;
  // The tenant's Root CA private key is never sent to the proxy. Leaf
  // certificates are issued via SignLeafCertificate, which signs a
  // proxy-submitted CSR without exposing the CA private key.
  reserved 5;
  reserved "ca_key_pem";
  // Bearer session token, issued once here and never sent again. The proxy
  // must attach it as gRPC metadata ("authorization: bearer <token>") on
  // every subsequent call on this service. Cloud verifies it server-side
  // and derives the caller's tenant_id/proxy_id from it — request-body
  // tenant_id/proxy_id fields on other RPCs are no longer trusted on their
  // own. Re-registering issues a new token and invalidates the previous
  // one. This token expires — see session_token_expires_at — and must be
  // renewed via RefreshSessionToken before it does.
  string session_token = 6;
  // Unix timestamp when session_token expires. The proxy must call
  // RefreshSessionToken well before this to avoid losing authentication.
  int64 session_token_expires_at = 7;
}

// --- Session Token Refresh ---
// Renews the caller's session token before it expires. Authenticated via
// the existing (possibly soon-to-expire) session token like every RPC
// except Register — the proxy is already a known, trusted identity at
// this point, so no registration token is needed. Issues a brand new
// token and invalidates the previous one, mirroring Register's issuance.

message RefreshSessionTokenRequest {}

message RefreshSessionTokenResponse {
  bool success = 1;
  string error_message = 2;
  // New bearer session token. Replaces the one used to authenticate this
  // call; the old token is invalidated immediately.
  string session_token = 3;
  // Unix timestamp when the new session_token expires.
  int64 session_token_expires_at = 4;
}

// --- Health ---

message HealthReport {
  string component_id = 1;
  string tenant_id = 2;
  string status = 3;
  string version = 4;
  int64 timestamp = 5;
  int32 active_connections = 6;
}

message HealthAck {
  bool acknowledged = 1;
}

// --- Events ---

message WorkloadEventBatch {
  string tenant_id = 1;
  repeated WorkloadEvent events = 2;
}

message WorkloadEvent {
  string event_id = 1;
  string connection_id = 2;
  string event_type = 3;
  string policy_id = 4;
  string client_workload_id = 5;
  string server_workload_id = 6;
  string outcome = 7;
  string severity = 8;
  string resource_set_id = 9;
  int64 timestamp = 10;
  bytes payload = 11;
}

message EventAck {
  int32 accepted = 1;
}

// --- Leaf Certificate Signing ---
// The proxy generates an ephemeral key pair + CSR locally and requests Cloud
// to sign it. Cloud validates the hostname against active policies and signs
// the CSR with the tenant's Root CA. The private CA key never leaves Cloud.

message SignLeafRequest {
  // DER-encoded Certificate Signing Request generated by the proxy.
  bytes csr_der = 1;
  // Target server hostname. Must match the CSR's SAN exactly.
  string hostname = 2;
  // Authenticated proxy ID (for audit trail).
  string proxy_id = 3;
  // Tenant ID derived from the authenticated session context.
  string tenant_id = 4;
}

message SignLeafResponse {
  // DER-encoded signed leaf certificate.
  bytes cert_der = 1;
  // Unix timestamp when the leaf certificate expires.
  int64 not_after = 2;
  // Whether the signing was successful.
  bool success = 3;
  // Error message if signing failed.
  string error_message = 4;
}
