services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dipole
      POSTGRES_USER: dipole
      POSTGRES_PASSWORD: dipole
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dipole"]
      interval: 5s
      timeout: 3s
      retries: 5

  cloud:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DIPOLE_DATABASE_URL: postgres://dipole:dipole@postgres:5432/dipole?sslmode=disable
      DIPOLE_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      DIPOLE_GRPC_PORT: "50051"
      DIPOLE_HTTP_PORT: "8080"
      DIPOLE_LOG_LEVEL: debug
      DIPOLE_REGION: ap-south-1
      DIPOLE_GEOIP_DB_PATH: /data/GeoLite2-City.mmdb
      DIPOLE_TENANT_SUBDOMAIN: "dev"
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "4000:80"
    depends_on:
      cloud:
        condition: service_healthy

  # Agent Proxy — start with: docker compose --profile proxy up -d proxy
  # Requires DIPOLE_TENANT_ID to match the auto-bootstrapped tenant UUID
  # (visible in cloud logs on first startup).
  proxy:
    build:
      context: .
      dockerfile: edge/Dockerfile.proxy
    profiles: ["proxy"]
    ports:
      - "8000:8000"
      - "9099:9099"
    environment:
      DIPOLE_TENANT_ID: "${DIPOLE_TENANT_ID:-00000000-0000-0000-0000-000000000001}"
      DIPOLE_CLOUD_GRPC_ENDPOINT: "cloud:50051"
      DIPOLE_GRPC_INSECURE: "true"
      DIPOLE_HTTP_SERVER_PORT: "8000"
      DIPOLE_METRICS_PORT: "9099"
      DIPOLE_LOG_LEVEL: debug
      DIPOLE_PASS_THROUGH_TRAFFIC_BEFORE_REGISTRATION: "true"
      K8S_NAMESPACE: default
      K8S_POD_NAME: dev-proxy
    depends_on:
      cloud:
        condition: service_healthy

  # Optional dev tools — start with: docker compose --profile tools up -d adminer
  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
